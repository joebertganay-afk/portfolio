<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Network Registration Portal</title>
    <style>
        :root {
            --bg-base: #0a0a0c;
            --bg-surface: #121216;
            --brand-primary: #3b82f6; 
            --brand-success: #10b981;
            --text-heading: #ffffff;
            --text-muted: #9ca3af;
            --border-ui: #26262b;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-heading);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .registration-card {
            max-width: 650px;
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        
        .glowing-logo-bg {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(59, 130, 246, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        
        .org-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-ui);
            padding-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .header-logo-container {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: #1e1e24;
            border: 2px solid var(--brand-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        h1 { font-size: 1.6rem; margin: 12px 0 6px; font-weight: 800; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin: 0; }
        .section-divider {
            grid-column: span 2;
            font-size: 0.85rem;
            color: var(--brand-primary);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #2d2d3a;
            padding-bottom: 5px;
            margin: 15px 0 5px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .field-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        input, select, textarea {
            padding: 12px;
            background: #0a0a0c;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--brand-primary); outline: none; }
        input:disabled { background: #16161c; color: var(--text-muted); cursor: not-allowed; }
        textarea { resize: vertical; min-height: 60px; }
        .submit-btn {
            width: 100%;
            background: var(--brand-primary);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #2563eb; }
        
        /* 📸 High-Visibility Screenshot Receipt Interface Card Styles */
        .database-trace {
            display: none;
            background: #141b18;
            border: 2px solid var(--brand-success);
            padding: 25px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 30px;
            line-height: 1.6;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        .screenshot-notice {
            background: rgba(16, 185, 129, 0.1);
            color: var(--brand-success);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 0.85rem;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #1f2924;
        }
        .receipt-label { color: #8fa399; font-family: monospace; }
        .receipt-value { color: #ffffff; font-weight: 500; }
        .reference-token {
            font-size: 1.4rem;
            color: #ffffff;
            background: #0d110f;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 2px;
            border: 1px dashed var(--brand-success);
            margin: 15px 0;
        }
        .motto-banner {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #1f2924;
            font-style: italic;
            color: #a3b8ad;
            font-weight: 600;
        }
        .flag-icon { display: block; font-size: 1.4rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="registration-card">
    <div class="glowing-logo-bg"></div>
    
    <div class="org-header">
        <div class="header-logo-container">
            <img src="../logo.png" alt="Organization Logo" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        </div>
        <h1 style="color: #ffffff; font-size: 1.5rem; margin-top: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">United GUARDIANS Wing Worldwide Inc.</h1>
        <p style="color: #3b82f6; font-size: 0.85rem; font-weight: bold; margin: 5px 0 0; letter-spacing: 1px; font-family: monospace;">SEC REG. NO. 2024120180352-00</p>
        <p class="subtitle" style="margin-top: 10px;">Secure Operational Network Intake Form Matrix</p>
    </div>

    <form id="registration-form" autocomplete="off">
        <div class="form-grid">
            
            <!-- 🗺️ MUNICIPAL ROUTING SELECTION -->
            <div class="field-group full-width">
                <label for="reg-municipality">Target Sorting Municipality (Spreadsheet Sheet Tab Segregation)</label>
                <select id="reg-municipality" required>
                    <option value="" disabled selected>-- Select Target Municipality to Route Data --</option>
                    <option value="Impasugong">Impasugong Queue</option>
                    <option value="Sumilao">Sumilao Queue</option>
                    <option value="Mis.Or.">Mis.Or. Queue</option>
                </select>
            </div>

            <div class="section-divider">Registrant Primary Details</div>

            <div class="field-group full-width">
                <label for="reg-name">Full Legal Name</label>
                <input type="text" id="reg-name" placeholder="First Name, Middle Initial, Last Name" required>
            </div>

            <div class="field-group">
                <label for="reg-alias">Pseudonym / Alias / Call Sign</label>
                <input type="text" id="reg-alias" placeholder="Organizational Alias (If Applicable)" required>
            </div>

            <div class="field-group">
                <label for="reg-rank">Rank / Position inside Organization</label>
                <select id="reg-rank" required>
                    <option value="" disabled selected>-- Select Current Rank --</option>
                    <option value="Founder">Founder</option>
                    <option value="National President">National President</option>
                    <option value="Regional Director">Regional Director</option>
                    <option value="Province Officer">Province Officer</option>
                    <option value="Chapter President">Chapter President</option>
                    <option value="Guardian Member">Guardian Member</option>
                    <option value="Prospect / Applicant">Prospect / Applicant</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="field-group full-width">
                <label for="reg-wing">Official Chapter / Wing Name affiliation</label>
                <input type="text" id="reg-wing" placeholder="Specify full name of designated local wing asset" required>
            </div>

            <div class="field-group">
                <label for="reg-dob">Date of Birth</label>
                <input type="date" id="reg-dob" required>
            </div>

            <div class="field-group">
                <label for="reg-age">Calculated Age</label>
                <input type="text" id="reg-age" placeholder="Automated Engine Metric" disabled>
            </div>

            <div class="field-group">
                <label for="reg-blood">Blood Type</label>
                <select id="reg-blood" required>
                    <option value="" disabled selected>-- Select Type --</option>
